name: Nightly mutual fund NAVs

# Refreshes nav.json (VFFSX, TLXIX, FSSNX, FSMDX) after fund NAVs post.
# The dashboard reads nav.json same-origin at each load — no CORS issues,
# no API key needed. Upload this file to .github/workflows/ in the repo.

on:
  schedule:
    # 2:00 AM UTC = 10:00 PM ET (EDT) / 9:00 PM ET (EST), after NAVs post
    - cron: '0 2 * * *'
  workflow_dispatch:  # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update-navs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest NAVs from Yahoo Finance
        run: |
          python3 - <<'EOF'
          import json, urllib.request, datetime
          FUNDS = ["VFFSX", "TLXIX", "FSSNX", "FSMDX"]
          out = {"asOf": datetime.date.today().isoformat(), "funds": {}}
          for t in FUNDS:
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{t}?interval=1d&range=10d"
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          j = json.load(r)
                      break
                  except Exception as e:
                      print(t, "attempt", attempt, "failed:", e)
                      if attempt == 2:
                          raise
              res = j["chart"]["result"][0]
              ts = res["timestamp"]
              closes = res["indicators"]["quote"][0]["close"]
              pts = [(datetime.datetime.fromtimestamp(x, datetime.timezone.utc).date().isoformat(), c)
                     for x, c in zip(ts, closes) if c is not None]
              if len(pts) < 2:
                  raise RuntimeError(t + ": not enough NAV history")
              (d1, c1), (d0, c0) = pts[-1], pts[-2]
              out["funds"][t] = {"nav": round(c1, 4), "prev": round(c0, 4), "date": d1}
          with open("nav.json", "w") as f:
              json.dump(out, f, indent=1)
          print(json.dumps(out, indent=1))
          EOF

      - name: Commit updated nav.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nav.json
          git diff --cached --quiet || git commit -m "Nightly mutual fund NAV update"
          git push
